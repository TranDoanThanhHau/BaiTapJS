<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- bài 1 -->
    <div class="w-xl text-center pt-10">
      <h1 class="font-bold text-4xl pb-3 text-cyan-500">
        Bài 1: Tính lương nhân viên
      </h1>
      <form class="max-w-sm mx-auto">
        <label
          for="number-input"
          class="block mb-2.5 text-sm font-medium text-heading text-left"
          >Nhập số ngày làm việc:</label
        >
        <input
          type="number"
          id="soNgayLam"
          aria-describedby="helper-text-explanation"
          class="block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
          placeholder="VD: 1 2 3 "
          required
        />
        <button
          id="btnTinhluong"
          type="button"
          class="text-white bg-gradient-to-r from-purple-500 to-pink-500 hover:bg-gradient-to-l focus:ring-4 focus:outline-none focus:ring-purple-200 dark:focus:ring-purple-800 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 mt-5 w-full"
        >
          Tính lương
        </button>
      </form>
      <p id="pInfo" class="max-w-sm mx-auto"></p>
      <br />
      <hr />
    </div>
    <!-- bài 2 -->
    <div class="w-xl text-center pt-10">
      <h1 class="font-bold text-4xl pb-3 text-cyan-500">
        Bài 2: Tính tổng 5 số thực
      </h1>
      <form class="max-w-sm mx-auto">
        <label
          for="number-input"
          class="block mb-2.5 text-sm font-medium text-heading text-left"
          >Nhập số thứ 1:</label
        >
        <input
          type="number"
          id="soThu1"
          aria-describedby="helper-text-explanation"
          class="block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body mb-2"
          placeholder="VD: 1 2 3 "
          required
        />
        <label
          for="number-input"
          class="block mb-2.5 text-sm font-medium text-heading text-left"
          >Nhập số thứ 2:</label
        >
        <input
          type="number"
          id="soThu2"
          aria-describedby="helper-text-explanation"
          class="block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body mb-2"
          placeholder="VD: 1 2 3 "
          required
        />
        <label
          for="number-input"
          class="block mb-2.5 text-sm font-medium text-heading text-left"
          >Nhập số thứ 3:</label
        >
        <input
          type="number"
          id="soThu3"
          aria-describedby="helper-text-explanation"
          class="block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body mb-2"
          placeholder="VD: 1 2 3 "
          required
        />
        <label
          for="number-input"
          class="block mb-2.5 text-sm font-medium text-heading text-left"
          >Nhập số thứ 4:</label
        >
        <input
          type="number"
          id="soThu4"
          aria-describedby="helper-text-explanation"
          class="block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body mb-2"
          placeholder="VD: 1 2 3 "
          required
        />
        <label
          for="number-input"
          class="block mb-2.5 text-sm font-medium text-heading text-left"
          >Nhập số thứ 5:</label
        >
        <input
          type="number"
          id="soThu5"
          aria-describedby="helper-text-explanation"
          class="block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body mb-2"
          placeholder="VD: 1 2 3 "
          required
        />
        <button
          id="btnTinhGiaTriTrungBinh"
          type="button"
          class="text-white bg-gradient-to-r from-purple-500 to-pink-500 hover:bg-gradient-to-l focus:ring-4 focus:outline-none focus:ring-purple-200 dark:focus:ring-purple-800 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 mt-5 w-full"
        >
          Tính trung bình
        </button>
      </form>
      <p id="pInfo_1" class="max-w-sm mx-auto"></p>
      <br />
      <hr />
    </div>
    <!-- bài 3 -->
    <div class="w-xl text-center pt-10">
      <h1 class="font-bold text-4xl pb-3 text-cyan-500">Bài 3: Quy đổi tiền</h1>
      <form class="max-w-sm mx-auto">
        <label
          for="number-input"
          class="block mb-2.5 text-sm font-medium text-heading text-left"
          >Nhập số tiền USD muốn đổi:</label
        >
        <input
          type="number"
          id="soTienMuonDoi"
          aria-describedby="helper-text-explanation"
          class="block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
          placeholder="VD: 1, 10 ,100, 1000"
          required
        />
        <button
          id="btnQuyDoiTien"
          type="button"
          class="text-white bg-gradient-to-r from-purple-500 to-pink-500 hover:bg-gradient-to-l focus:ring-4 focus:outline-none focus:ring-purple-200 dark:focus:ring-purple-800 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 mt-5 w-full"
        >
          Quy đổi tiền
        </button>
      </form>
      <p id="pInfo_3" class="max-w-sm mx-auto"></p>
      <br />
      <hr />
    </div>
    <!-- bài 4 -->
    <div class="w-xl text-center pt-10">
      <h1 class="font-bold text-4xl pb-3 text-cyan-500">
        Bài 4: Tính chu vi, diện tích hình chữ nhật
      </h1>
      <form class="max-w-sm mx-auto">
        <label
          for="number-input"
          class="block mb-2.5 text-sm font-medium text-heading text-left"
          >Nhập chiều dài:</label
        >
        <input
          type="number"
          id="chieuDai"
          aria-describedby="helper-text-explanation"
          class="block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
          placeholder="VD: 1, 3, 5, 10"
          required
        />
        <label
          for="number-input"
          class="block mb-2.5 text-sm font-medium text-heading text-left"
          >Nhập chiều rộng:</label
        >
        <input
          type="number"
          id="chieuRong"
          aria-describedby="helper-text-explanation"
          class="block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
          placeholder="VD: 1, 3, 5, 10"
          required
        />
        <button
          id="btnTinhChuViDienTich"
          type="button"
          class="text-white bg-gradient-to-r from-purple-500 to-pink-500 hover:bg-gradient-to-l focus:ring-4 focus:outline-none focus:ring-purple-200 dark:focus:ring-purple-800 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 mt-5 w-full"
        >
          Tính chu vi, diện tích
        </button>
      </form>
      <p id="pInfo_4" class="max-w-sm mx-auto"></p>
      <br />
      <hr />
    </div>
    <!-- bài 5 -->
    <div class="w-xl text-center pt-10">
      <h1 class="font-bold text-4xl pb-3 text-cyan-500">
        Bài 5: Tính tổng 2 ký số
      </h1>
      <form class="max-w-sm mx-auto">
        <label
          for="number-input"
          class="block mb-2.5 text-sm font-medium text-heading text-left"
          >Nhập số có 2 chữ số:</label
        >
        <input
          type="number"
          id="so_2"
          aria-describedby="helper-text-explanation"
          class="block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
          placeholder="VD: 10 - 99"
          required
        />
        <button
          id="btnTinhTong2KySo"
          type="button"
          class="text-white bg-gradient-to-r from-purple-500 to-pink-500 hover:bg-gradient-to-l focus:ring-4 focus:outline-none focus:ring-purple-200 dark:focus:ring-purple-800 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 mt-5 w-full"
        >
          Tính tổng hai ký số
        </button>
      </form>
      <p id="pInfo_5" class="max-w-sm mx-auto"></p>
      <br />
      <hr />
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
